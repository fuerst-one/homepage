# Host/container administration uses the local socket. Remote traffic always requires TLS.
local all all trust
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl homepage_knowledge homepage_app,homepage_indexer 0.0.0.0/0 scram-sha-256
hostssl homepage_knowledge homepage_app,homepage_indexer ::/0 scram-sha-256
